<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body {
    width: 260px;
    margin: 0;
    padding: 16px;
    background: #141a21;
    color: #e8eef7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 14px; }
  .brand img { width: 20px; height: 20px; }
  .state { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .state.on { color: #4fd18b; }
  .state.off { color: #94a3b8; }
  .detail { font-size: 12px; color: #94a3b8; line-height: 1.6; }
  .countdown { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 10px 0 4px; }
  .row { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2a333d; }
  .err { color: #ffb4b7; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="brand"><img src="icons/icon48.png" alt="" /> FocusLock</div>
  <div id="content"><div class="detail">Checking…</div></div>
  <script src="popup.js"></script>
</body>
</html>
