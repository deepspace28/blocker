<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>You are free</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,0.18), transparent 60%),
      linear-gradient(160deg, #0f6b3a 0%, #1c7a43 40%, #2fae66 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .wrap {
    text-align: center;
    padding: 32px 24px;
    max-width: 560px;
    animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  .butterfly {
    font-size: 104px;
    line-height: 1;
    margin-bottom: 28px;
    filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.28));
    animation: flutter 4s ease-in-out infinite;
  }

  h1 {
    font-size: clamp(26px, 4.4vw, 40px);
    font-weight: 750;
    margin: 0;
    letter-spacing: -0.4px;
    text-wrap: balance;
  }

  .sub {
    margin-top: 14px;
    font-size: 15px;
    color: rgba(255, 255, 255, 0.82);
  }

  .card {
    margin-top: 30px;
    display: inline-flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px 28px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
  }
  .card.hidden { display: none; }

  .count {
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  .count-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: rgba(255, 255, 255, 0.72);
  }

  .host {
    margin-top: 22px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.62);
  }

  @keyframes flutter {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-14px) rotate(5deg); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .butterfly, .wrap { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="butterfly">🦋</div>
    <h1>You are free from your loop</h1>
    <div class="sub" id="sub">FocusLock is protecting your session.</div>

    <div class="card hidden" id="card">
      <span class="count" id="count">--:--:--</span>
      <span class="count-label" id="count-label">left in this session</span>
    </div>

    <div class="host" id="host"></div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
